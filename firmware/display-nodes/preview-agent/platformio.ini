; PlatformIO Project Configuration File for espDash Display Preview Agent
; Supports ESP32-S3-LCD-3.14, Seeed XIAO ESP32-S3 JXL Round, and Waveshare LCDs

[env:esp32-s3-lcd-314]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I ../shared

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^6.21.3

[env:xiao-round-gauge]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -I ../shared

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^6.21.3
