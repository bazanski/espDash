; PlatformIO Project Configuration File for espDash Display Preview Agent
; Supports ESP32-S3-LCD-3.14, Seeed XIAO ESP32-S3 JXL Round, and Waveshare LCDs

[env:xiao-round-gauge]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_extra_dirs = ${PROJECT_DIR}/../../shared

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=9
    -DTFT_SCLK=8
    -DTFT_CS=3
    -DTFT_DC=4
    -DTFT_RST=2
    -DTFT_BL=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=80000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^6.21.3
    EspDashProto
