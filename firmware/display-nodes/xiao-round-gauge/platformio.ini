[env:seeed_xiao_esp32s3]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default_8MB.csv

; Shared ESP-NOW wire protocol - same header the gateway builds against.
lib_extra_dirs = ${PROJECT_DIR}/../../shared

lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^6.21.3
    lvgl/lvgl@^8.3.11
    EspDashProto

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/src/ui
    -I${PROJECT_DIR}/.pio/libdeps/seeed_xiao_esp32s3
    ; Node Wi-Fi/mDNS/OTA/WebOTA, OFF by default. A measured on-bench test
    ; showed that when the node's Wi-Fi DOES connect, it parks the radio on
    ; whatever channel that AP uses - which silently deafens it to the
    ; gateway's ESP-NOW broadcasts on ESPDASH_ESPNOW_CHANNEL whenever the two
    ; don't match (a single radio can't listen on two channels at once). With
    ; Wi-Fi off, the node locks to the same fixed channel as the gateway and
    ; the mismatch can't happen. Set this to 1 and rebuild to restore
    ; Wi-Fi/OTA for UI/bench work - the code is gated, not deleted.
    -DESPDASH_NODE_WIFI=0
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_CS=2
    -DTFT_DC=3
    -DTFT_RST=4
    -DTFT_BL=43
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
