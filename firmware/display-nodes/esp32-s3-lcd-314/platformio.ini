[env:esp32-s3-lcd-314]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 115200

; Shared ESP-NOW wire protocol
lib_extra_dirs = ${PROJECT_DIR}/../../shared

lib_deps =
    lvgl/lvgl@^8.4.0
    EspDashProto
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -I src/bsp
    -I src/bsp/st7701_bsp
    -I src/bsp/io_additions
    -I src/ui
    -I ${PROJECT_DIR}/.pio/libdeps/esp32-s3-lcd-314/lvgl/src
    -DESPDASH_NODE_WIFI=0
