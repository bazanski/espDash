[env:esp32_s3_zero]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_extra_dirs = ${PROJECT_DIR}/../../shared

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@^8.3.11
    EspDashProto

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/src/ui
    -I${PROJECT_DIR}/.pio/libdeps/esp32_s3_zero
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DESPDASH_NODE_WIFI=0
    -DXIAO_DUAL_SEAM_TEST=0

[env:seeed_xiao_esp32s3]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default_8MB.csv

; Shared ESP-NOW wire protocol - same header the gateway builds against.
lib_extra_dirs = ${PROJECT_DIR}/../../shared

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@^8.3.11
    EspDashProto

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/src/ui
    -I${PROJECT_DIR}/.pio/libdeps/seeed_xiao_esp32s3
    -DESPDASH_NODE_WIFI=0
    -DXIAO_DUAL_SEAM_TEST=0
