[env:seeed_xiao_esp32s3]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default_8MB.csv

; Shared ESP-NOW wire protocol - same header the gateway builds against.
lib_extra_dirs = ${PROJECT_DIR}/../../shared

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@^8.3.11
    EspDashProto

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/src/ui
    -I${PROJECT_DIR}/.pio/libdeps/seeed_xiao_esp32s3
    ; No Wi-Fi is ever attempted on this node either - see the comment in
    ; setup() in main.cpp for why (mirrors xiao-round-gauge).
    -DESPDASH_NODE_WIFI=0
    ; Off by default. Flip to 1 to validate the LVGL 240x480 -> two-panel
    ; split on the bench before trusting the placeholder/EEZ UI: draws a
    ; full-height vertical bar and a box centred on the seam (y=240) through
    ; the real flush_cb path.
    -DXIAO_DUAL_SEAM_TEST=0
