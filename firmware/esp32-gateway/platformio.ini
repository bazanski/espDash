[env:esp32-gateway]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    links2004/WebSockets@^2.4.1

; Wireless ArduinoOTA deployment setup (uncomment for wireless flashing)
; upload_protocol = espota
; upload_port = esp32-gateway.local
upload_speed = 115200
