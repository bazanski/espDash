[platformio]
; `pio run` builds only the firmware. The native env below is test-only
; (it has no main() outside the test runner) - use `pio test -e native`.
default_envs = esp32-gateway

[env:esp32-gateway]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Gateway Wi-Fi/mDNS/OTA/WebSocket/Telnet, OFF by default. An on-car test
    ; showed the gateway's own Wi-Fi station (scanning/associating/roaming)
    ; degrading the ESP-NOW link to the display nodes, so the default build
    ; never attempts a Wi-Fi connection at all - see ARCHITECTURE.md S5.1.
    ; Set this to 1 and rebuild to restore the old Wi-Fi-connected behavior
    ; (mDNS, ArduinoOTA, the WebSocket dashboard path, Telnet) - the code is
    ; gated, not deleted, so this is the only change needed.
    -DESPDASH_GATEWAY_WIFI=0

; Shared ESP-NOW wire protocol, also used by every display node.
lib_extra_dirs = ${PROJECT_DIR}/../shared

lib_deps =
    links2004/WebSockets@^2.4.1
    EspDashProto

; Wireless ArduinoOTA deployment setup - only functional when built with
; -DESPDASH_GATEWAY_WIFI=1 (see build_flags above).
; upload_protocol = espota
; upload_port = esp32-gateway.local
upload_speed = 115200


; =========================================================================
; Host test environment
; =========================================================================
; can_decode.cpp is deliberately free of Arduino/ESP-IDF dependencies so the
; decode table can be replayed against recorded traces without a car:
;     pio test -e native -d firmware/esp32-gateway
; =========================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<can_decode.cpp>
build_flags =
    -std=c++11
    -I src
    -DFIXTURE_DIR='"${PROJECT_DIR}/test/fixtures"'
