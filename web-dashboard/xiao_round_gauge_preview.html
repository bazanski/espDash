<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO Round Universal Gauge UI Preview - espDash</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141b2d;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff66;
            --accent-yellow: #ffcc00;
            --accent-red: #ff3366;
            --accent-blue: #0088ff;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
            align-items: center;
            max-width: 1100px;
            width: 100%;
        }

        .gauge-viewport-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle at center, #1e2942 0%, #0b0f19 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 8px solid #1a2336;
        }

        /* Bezel simulation */
        .gauge-viewport-wrapper::before {
            content: '';
            position: absolute;
            top: -16px;
            left: -16px;
            right: -16px;
            bottom: -16px;
            border-radius: 50%;
            border: 2px solid #2a3854;
            pointer-events: none;
        }

        canvas#gaugeCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background-color: #050811;
        }

        .controls-panel {
            background-color: var(--card-bg);
            border: 1px solid #222e48;
            border-radius: 16px;
            padding: 24px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .controls-panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--text-main);
            border-bottom: 1px solid #222e48;
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .control-group label span.val {
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-cyan);
            background: #0f1523;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-cyan);
            color: #050811;
        }

        .btn-primary:hover {
            background-color: #33f3ff;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #222e48;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #2c3c5e;
        }

        .badge-list {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            background-color: #1a2336;
            color: var(--text-muted);
            border: 1px solid #2a3854;
        }

        .badge.active {
            background-color: rgba(0, 240, 255, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎️ XIAO Round Universal Gauge Visualizer</h1>
        <p>Interactive 240x240 Circular Display Layout Mockup — Target Host: <code>esp32-gauge-round.local</code></p>
    </header>

    <div class="main-container">
        <!-- Circular Display Gauge Simulator -->
        <div class="gauge-viewport-wrapper">
            <canvas id="gaugeCanvas" width="480" height="480"></canvas>
        </div>

        <!-- Live Controls Panel -->
        <div class="controls-panel">
            <h2>🎛️ Live Telemetry Simulator</h2>

            <div class="control-group" style="margin-bottom: 18px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; border: 1px solid #222e48;">
                <label style="font-weight: bold; color: var(--text-main);">🎨 EEZ Studio Theme Selector</label>
                <select id="themeSelector" style="width: 100%; padding: 8px 12px; border-radius: 6px; background: #0f1523; color: #fff; border: 1px solid #2a3854; font-size: 13px; font-weight: 600; cursor: pointer;">
                    <option value="theme_default">Cyber Cyan (Default)</option>
                    <option value="theme_18_black_white_shapes">Theme 18: The Black White Shapes (EEZ Studio #18)</option>
                </select>
            </div>

            <div class="control-group">
                <label>1. Engine Speed (RPM) <span class="val" id="valRpm">5400 RPM</span></label>
                <input type="range" id="sliderRpm" min="0" max="8500" value="5400" step="50">
            </div>

            <div class="control-group">
                <label>2. Vehicle Speed (Speed) <span class="val" id="valSpeed">124 km/h</span></label>
                <input type="range" id="sliderSpeed" min="0" max="260" value="124" step="1">
            </div>

            <div class="control-group">
                <label>3. Coolant Temperature <span class="val" id="valTemp">92 °C</span></label>
                <input type="range" id="sliderTemp" min="40" max="130" value="92" step="1">
            </div>

            <div class="control-group">
                <label>4. Steering Angle <span class="val" id="valSteering">45° R</span></label>
                <input type="range" id="sliderSteering" min="-540" max="540" value="45" step="5">
            </div>

            <div class="control-group">
                <label>5. Throttle Position <span class="val" id="valThrottle">78 %</span></label>
                <input type="range" id="sliderThrottle" min="0" max="100" value="78" step="1">
            </div>

            <div class="control-group">
                <label>6. Brake Pressure <span class="val" id="valBrake">42 bar</span></label>
                <input type="range" id="sliderBrake" min="0" max="150" value="42" step="1">
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="btnAutoDemo">▶ Auto Demo Sweep</button>
                <button class="btn btn-secondary" id="btnReset">Reset Values</button>
            </div>

            <div class="badge-list">
                <span class="badge active">ESP-NOW ~1ms</span>
                <span class="badge active">ArduinoOTA Enabled</span>
                <span class="badge active">WiFiMulti (4 Networks)</span>
                <span class="badge active">GC9A01 240x240</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gaugeCanvas');
        const ctx = canvas.getContext('2d');

        // Inputs
        const sliderRpm = document.getElementById('sliderRpm');
        const sliderSpeed = document.getElementById('sliderSpeed');
        const sliderTemp = document.getElementById('sliderTemp');
        const sliderSteering = document.getElementById('sliderSteering');
        const sliderThrottle = document.getElementById('sliderThrottle');
        const sliderBrake = document.getElementById('sliderBrake');

        // Value Displays
        const valRpm = document.getElementById('valRpm');
        const valSpeed = document.getElementById('valSpeed');
        const valTemp = document.getElementById('valTemp');
        const valSteering = document.getElementById('valSteering');
        const valThrottle = document.getElementById('valThrottle');
        const valBrake = document.getElementById('valBrake');

        const btnAutoDemo = document.getElementById('btnAutoDemo');
        const btnReset = document.getElementById('btnReset');

        let isDemoMode = false;
        let demoPhase = 0;

        function updateLabels() {
            valRpm.textContent = `${sliderRpm.value} RPM`;
            valSpeed.textContent = `${sliderSpeed.value} km/h`;
            valTemp.textContent = `${sliderTemp.value} °C`;
            const st = parseInt(sliderSteering.value);
            valSteering.textContent = st === 0 ? "0°" : (st > 0 ? `${st}° R` : `${Math.abs(st)}° L`);
            valThrottle.textContent = `${sliderThrottle.value} %`;
            valBrake.textContent = `${sliderBrake.value} bar`;
        }

        [sliderRpm, sliderSpeed, sliderTemp, sliderSteering, sliderThrottle, sliderBrake].forEach(s => {
            s.addEventListener('input', () => {
                isDemoMode = false;
                btnAutoDemo.textContent = '▶ Auto Demo Sweep';
                updateLabels();
            });
        });

        btnReset.addEventListener('click', () => {
            isDemoMode = false;
            btnAutoDemo.textContent = '▶ Auto Demo Sweep';
            sliderRpm.value = 5400;
            sliderSpeed.value = 124;
            sliderTemp.value = 92;
            sliderSteering.value = 45;
            sliderThrottle.value = 78;
            sliderBrake.value = 42;
            updateLabels();
        });

        btnAutoDemo.addEventListener('click', () => {
            isDemoMode = !isDemoMode;
            btnAutoDemo.textContent = isDemoMode ? '⏸ Pause Demo' : '▶ Auto Demo Sweep';
        });

        const themeSelector = document.getElementById('themeSelector');
        themeSelector.addEventListener('change', () => {
            if (themeSelector.value === 'theme_18_black_white_shapes') {
                document.body.setAttribute('data-theme', 'theme-18');
                canvas.style.backgroundColor = '#000000';
            } else {
                document.body.removeAttribute('data-theme');
                canvas.style.backgroundColor = '#050811';
            }
            drawGauge();
        });

        function drawGauge() {
            const w = canvas.width; // 480
            const h = canvas.height; // 480
            const cx = w / 2;
            const cy = h / 2;

            const isTheme18 = (themeSelector.value === 'theme_18_black_white_shapes');

            // Theme Color Tokens
            const colorRpmStart = isTheme18 ? '#9A9797' : '#00f0ff';
            const colorRpmMid = isTheme18 ? '#DBCFCF' : '#00ff66';
            const colorRpmPeak = isTheme18 ? '#ffffff' : '#ffcc00';
            const colorRpmAlert = isTheme18 ? '#ffffff' : '#ff3366';

            const colorThrottle = isTheme18 ? '#ffffff' : '#00ff66';
            const colorBrake = isTheme18 ? '#9A9797' : '#0088ff';
            const colorSteering = isTheme18 ? '#DBCFCF' : '#00f0ff';
            const colorTextMuted = isTheme18 ? '#9A9797' : '#8a99ad';
            const colorTrack = isTheme18 ? '#1c1c1c' : '#151f33';
            const colorBgTrack = isTheme18 ? '#121212' : '#101726';

            ctx.clearRect(0, 0, w, h);

            // Read values
            const rpm = parseFloat(sliderRpm.value);
            const speed = parseFloat(sliderSpeed.value);
            const temp = parseFloat(sliderTemp.value);
            const steering = parseFloat(sliderSteering.value);
            const throttle = parseFloat(sliderThrottle.value);
            const brake = parseFloat(sliderBrake.value);

            // 1. Shift Light Outer LED Ring (Top Arc from 135° to 45° across top, i.e. 210° to 330°)
            const shiftStart = Math.PI * 1.15;
            const shiftEnd = Math.PI * 1.85;
            const ledCount = 14;
            const rpmPct = Math.min(1.0, rpm / 7200);

            for (let i = 0; i < ledCount; i++) {
                const angle = shiftStart + (i / (ledCount - 1)) * (shiftEnd - shiftStart);
                const lx = cx + Math.cos(angle) * 215;
                const ly = cy + Math.sin(angle) * 215;
                const activeThreshold = (i + 1) / ledCount;

                ctx.beginPath();
                ctx.arc(lx, ly, 10, 0, Math.PI * 2);

                if (rpmPct >= activeThreshold) {
                    if (isTheme18) {
                        ctx.fillStyle = (i < 5) ? '#9A9797' : ((i < 10) ? '#DBCFCF' : '#ffffff');
                    } else {
                        if (i < 5) ctx.fillStyle = '#00ff66';      // Green LEDs
                        else if (i < 10) ctx.fillStyle = '#ffcc00'; // Yellow LEDs
                        else ctx.fillStyle = '#ff0044';             // Red Shift Warning
                    }
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = isTheme18 ? 6 : 12;
                } else {
                    ctx.fillStyle = isTheme18 ? '#181818' : '#151d2a';
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 2. RPM Outer Sweep Arc (0 to 8000 RPM, angle from 135° to 45°)
            const rpmAngleStart = Math.PI * 0.75; // 135 deg
            const rpmAngleEnd = Math.PI * 2.25;   // 405 deg (45 deg)
            const currentRpmAngle = rpmAngleStart + (Math.min(rpm, 8000) / 8000) * (rpmAngleEnd - rpmAngleStart);

            // Track background arc
            ctx.beginPath();
            ctx.arc(cx, cy, 185, rpmAngleStart, rpmAngleEnd);
            ctx.strokeStyle = colorTrack;
            ctx.lineWidth = 14;
            ctx.stroke();

            // Active RPM arc gradient
            const rpmGrad = ctx.createConicGradient(rpmAngleStart, cx, cy);
            rpmGrad.addColorStop(0, colorRpmStart);
            rpmGrad.addColorStop(0.6, colorRpmMid);
            rpmGrad.addColorStop(0.85, colorRpmPeak);
            rpmGrad.addColorStop(1.0, colorRpmAlert);

            ctx.beginPath();
            ctx.arc(cx, cy, 185, rpmAngleStart, currentRpmAngle);
            ctx.strokeStyle = rpmGrad;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.shadowColor = colorRpmStart;
            ctx.shadowBlur = isTheme18 ? 4 : 15;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 3. Left Arc: Throttle Position (0 - 100%)
            const thStart = Math.PI * 0.85;
            const thEnd = Math.PI * 1.35;
            const thValAngle = thStart + (throttle / 100) * (thEnd - thStart);

            ctx.beginPath();
            ctx.arc(cx, cy, 155, thStart, thEnd);
            ctx.strokeStyle = colorBgTrack;
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 155, thStart, thValAngle);
            ctx.strokeStyle = colorThrottle;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = colorThrottle;
            ctx.shadowBlur = isTheme18 ? 4 : 8;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Throttle label
            ctx.fillStyle = colorThrottle;
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`${Math.round(throttle)}%`, cx - 128, cy);

            // 4. Right Arc: Brake Pressure (0 - 150 bar)
            const brStart = Math.PI * 2.15;
            const brEnd = Math.PI * 1.65;
            const brValAngle = brStart - (Math.min(brake, 150) / 150) * (brStart - brEnd);

            ctx.beginPath();
            ctx.arc(cx, cy, 155, brEnd, brStart);
            ctx.strokeStyle = colorBgTrack;
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 155, brValAngle, brStart);
            ctx.strokeStyle = colorBrake;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = colorBrake;
            ctx.shadowBlur = isTheme18 ? 4 : 8;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Brake label
            ctx.fillStyle = colorBrake;
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`${Math.round(brake)} B`, cx + 128, cy);

            // 5. Steering Angle Dial Ring (Inner Arc)
            const stAngleRad = (steering / 540) * (Math.PI * 0.5);
            ctx.beginPath();
            ctx.arc(cx, cy, 115, Math.PI * 1.25, Math.PI * 1.75);
            ctx.strokeStyle = isTheme18 ? '#222222' : '#1a263c';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Steering needle dot
            const stDotAngle = Math.PI * 1.5 + stAngleRad;
            const stDotX = cx + Math.cos(stDotAngle) * 115;
            const stDotY = cy + Math.sin(stDotAngle) * 115;

            ctx.beginPath();
            ctx.arc(stDotX, stDotY, 7, 0, Math.PI * 2);
            ctx.fillStyle = colorSteering;
            ctx.shadowColor = colorSteering;
            ctx.shadowBlur = isTheme18 ? 4 : 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Steering Angle Text
            ctx.fillStyle = colorTextMuted;
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            const stText = steering === 0 ? "ST: 0°" : (steering > 0 ? `ST: ${Math.round(steering)}° R` : `ST: ${Math.round(Math.abs(steering))}° L`);
            ctx.fillText(stText, cx, cy - 65);

            // 6. Center Digital Speed Readout
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 88px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(Math.round(speed), cx, cy + 25);

            ctx.fillStyle = colorTextMuted;
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('KM/H', cx, cy + 55);

            // 7. Coolant Temp Badge & Gear
            const isOverheat = temp > 105;
            ctx.fillStyle = isOverheat ? (isTheme18 ? '#ffffff' : '#ff3366') : (isTheme18 ? '#DBCFCF' : '#ff9900');
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`🌡️ ${Math.round(temp)}°C`, cx - 55, cy + 115);

            // Gear Badge
            ctx.beginPath();
            ctx.arc(cx + 65, cy + 110, 22, 0, Math.PI * 2);
            ctx.fillStyle = isTheme18 ? '#141414' : '#141b2d';
            ctx.strokeStyle = isTheme18 ? '#ffffff' : '#00f0ff';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('D4', cx + 65, cy + 116);
        }

        function animate() {
            if (isDemoMode) {
                demoPhase += 0.03;
                sliderRpm.value = Math.round(3000 + Math.sin(demoPhase) * 2800 + Math.sin(demoPhase * 3) * 500);
                sliderSpeed.value = Math.round(80 + Math.sin(demoPhase * 0.8) * 50);
                sliderSteering.value = Math.round(Math.sin(demoPhase * 1.2) * 180);
                sliderThrottle.value = Math.round(50 + Math.sin(demoPhase * 1.5) * 45);
                sliderBrake.value = Math.round(Math.max(0, -Math.sin(demoPhase * 1.5) * 90));
                sliderTemp.value = Math.round(90 + Math.sin(demoPhase * 0.2) * 8);
                updateLabels();
            }
            drawGauge();
            requestAnimationFrame(animate);
        }

        updateLabels();
        animate();
    </script>
</body>
</html>
